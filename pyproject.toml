[project]
name = "pcull"
version = "0.1.0"
description = "PC photo cleanup pipeline: score, flag flawed shots, review in local web UI"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pillow",
  "pillow-heif",
  "opencv-python-headless",
  "imagehash",
]

[project.optional-dependencies]
neural = ["torch", "pyiqa"]  # optional neural IQA, not installed by default

[project.scripts]
pcull = "pcull.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
